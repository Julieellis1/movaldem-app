apply plugin: 'com.android.application'

android {
    namespace = "org.movaldem.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.movaldem.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // One permanent key for every build machine. CI runners are
        // disposable and each invented its own debug key, which made
        // Android refuse updates ("signature does not match") and force
        // an uninstall before every update. This keystore is committed
        // on purpose: it carries the standard Android debug identity
        // whose password is public knowledge, so there is no secret to
        // leak. A Play Store release would use a separate private key.
        pinned {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Proper release signing. The release keystore is NEVER
        // committed (this repo is public) and its passwords are NEVER
        // written here. Supply them as environment variables or
        // Gradle properties, e.g. for a local build:
        //   MOVALDEM_RELEASE_KEYSTORE=/path/to/release.keystore
        //   MOVALDEM_RELEASE_KEY_ALIAS=movaldem
        //   MOVALDEM_RELEASE_STORE_PASSWORD=...
        //   MOVALDEM_RELEASE_KEY_PASSWORD=...
        // or the matching movaldemRelease* Gradle properties. Without
        // them, a release build falls back to the debug key with a
        // warning, so CI debug builds keep working but the result
        // must not be shipped as a release.
        release {
            def storePath = System.getenv('MOVALDEM_RELEASE_KEYSTORE') ?: project.findProperty('movaldemReleaseKeystore')
            def storePass = System.getenv('MOVALDEM_RELEASE_STORE_PASSWORD') ?: project.findProperty('movaldemReleaseStorePassword')
            def keyAliasProp = System.getenv('MOVALDEM_RELEASE_KEY_ALIAS') ?: project.findProperty('movaldemReleaseKeyAlias')
            def keyPass = System.getenv('MOVALDEM_RELEASE_KEY_PASSWORD') ?: project.findProperty('movaldemReleaseKeyPassword')
            if (storePath && storePass && keyAliasProp && keyPass && file(storePath).exists()) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias keyAliasProp
                keyPassword keyPass
            } else {
                logger.warn('No release keystore configured; release build will be signed with the debug key and must not be shipped as a release.')
                storeFile rootProject.file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.pinned
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
