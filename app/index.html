<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0E2A20"/>
<title>Movaldem Church App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div id="app">
  <!-- Splash / auth / screens render here -->
  <main id="screen" class="screen"></main>

  <!-- Persistent Zeno mini-player (shows while radio plays) -->
  <div id="mini-player" class="mini-player hidden" aria-hidden="true">
    <button class="mp-toggle" id="mp-toggle" aria-label="Play or pause radio">
      <span class="material-symbols-outlined" id="mp-icon">play_arrow</span>
    </button>
    <div class="mp-meta">
      <span class="mp-live"><span class="dot"></span>ON AIR</span>
      <span class="mp-title" id="mp-title">Movaldem Radio Live</span>
    </div>
    <button class="mp-close" id="mp-close" aria-label="Stop radio">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <!-- Bottom tab bar -->
  <nav id="tabbar" class="tabbar hidden" aria-label="Main navigation">
    <button class="tab" data-route="home"><span class="material-symbols-outlined">church</span><span>Home</span></button>
    <button class="tab" data-route="events"><span class="material-symbols-outlined">event</span><span>Events</span></button>
    <button class="tab" data-route="quiz"><span class="material-symbols-outlined">quiz</span><span>Quiz</span></button>
    <button class="tab" data-route="gallery"><span class="material-symbols-outlined">photo_library</span><span>Gallery</span></button>
    <button class="tab" data-route="profile"><span class="material-symbols-outlined">person</span><span>Profile</span></button>
  </nav>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
